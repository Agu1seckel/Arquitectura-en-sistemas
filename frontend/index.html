<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Institucional | Inicio</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="brand">WI</div>
        <h1>Web Institucional</h1>
        <p class="muted">Sistema de gestión académica</p>

        <form id="loginForm">
            <label for="email">Correo institucional</label>
            <input id="email" type="email" placeholder="usuario@institucion.cl" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="••••••••" required>

            <label for="role">Tipo de usuario</label>
            <select id="role">
                <option value="estudiante">Estudiante</option>
                <option value="docente">Docente</option>
                <option value="administrativo">Administrativo</option>
            </select>

            <button class="btn primary" type="submit">Ingresar</button>
        </form>

        <div class="demo-box">
            <strong>Beta:</strong> puedes ingresar con cualquier correo y contraseña.
            La sesión se simula en el navegador para probar la interfaz.
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
